name: attendance_app
description: AttendX v2 - GPS + Bluetooth Based Student Attendance System
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_functions: 5.6.2

  # ── Location & GPS ─────────────────────────────────────────
  geolocator: ^12.0.0

  # ── Bluetooth ──────────────────────────────────────────────
  flutter_blue_plus: ^1.31.0

  # ── Auth & Security ────────────────────────────────────────
  local_auth: ^2.3.0
  device_info_plus: ^10.0.0

  # ── Notifications ──────────────────────────────────────────
  flutter_local_notifications: ^17.0.0

  # ── UI ─────────────────────────────────────────────────────
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
